[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false

[theme.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#172B4D"
borderColor = "#E2E8F0"
primaryColor = "#2563EB"
linkColor = "#2563EB"

[theme]
chartCategoricalColors = ["#2563EB", "#0F766E", "#7C3AED", "#D97706", "#059669", "#DC2626", "#6B7280"]
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#172B4D"
dataframeHeaderTextColor = "#FFFFFF"

[theme]
paddingTop = "1rem"
paddingBottom = "2rem"